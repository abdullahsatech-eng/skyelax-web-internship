<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="FlowPilot is a fictional AI-powered team productivity platform designed to help small teams organize tasks, priorities, deadlines, meetings, and project progress."
    >

    <title>FlowPilot — Team Productivity, Clearly Organized</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Primary navigation">
            <div class="container nav-container">

                <a
                    class="brand"
                    href="#hero"
                    aria-label="FlowPilot home"
                >
                    <span
                        class="brand-mark"
                        aria-hidden="true"
                    >
                        F
                    </span>

                    <span class="brand-name">
                        FlowPilot
                    </span>
                </a>

                <button
                    class="nav-toggle"
                    type="button"
                    aria-label="Toggle navigation"
                    aria-expanded="false"
                    aria-controls="primary-navigation"
                >
                    <span
                        class="nav-toggle-icon"
                        aria-hidden="true"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>

                <div
                    class="nav-menu"
                    id="primary-navigation"
                >
                    <ul class="nav-links">
                        <li>
                            <a href="#features">
                                Features
                            </a>
                        </li>

                        <li>
                            <a href="#benefits">
                                Benefits
                            </a>
                        </li>

                        <li>
                            <a href="#how-it-works">
                                How It Works
                            </a>
                        </li>

                        <li>
                            <a href="#testimonials">
                                Testimonials
                            </a>
                        </li>

                        <li>
                            <a href="#faq">
                                FAQ
                            </a>
                        </li>
                    </ul>

                    <a
                        class="nav-cta"
                        href="#cta"
                    >
                        Start Free
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section
            id="hero"
            aria-labelledby="hero-heading"
        >
            <h1 id="hero-heading">
                FlowPilot
            </h1>
        </section>

        <section
            id="problem-solution"
            aria-labelledby="problem-solution-heading"
        >
            <h2 id="problem-solution-heading">
                Problem / Solution
            </h2>
        </section>

        <section
            id="how-it-works"
            aria-labelledby="how-it-works-heading"
        >
            <h2 id="how-it-works-heading">
                How It Works
            </h2>
        </section>

        <section
            id="features"
            aria-labelledby="features-heading"
        >
            <h2 id="features-heading">
                Features
            </h2>
        </section>

        <section
            id="benefits"
            aria-labelledby="benefits-heading"
        >
            <h2 id="benefits-heading">
                Benefits
            </h2>
        </section>

        <section
            id="product-experience"
            aria-labelledby="product-experience-heading"
        >
            <h2 id="product-experience-heading">
                Product Experience
            </h2>
        </section>

        <section
            id="testimonials"
            aria-labelledby="testimonials-heading"
        >
            <h2 id="testimonials-heading">
                Testimonials
            </h2>
        </section>

        <section
            id="cta"
            aria-labelledby="cta-heading"
        >
            <h2 id="cta-heading">
                Get Started
            </h2>
        </section>

        <section
            id="faq"
            aria-labelledby="faq-heading"
        >
            <h2 id="faq-heading">
                Frequently Asked Questions
            </h2>
        </section>
    </main>

    <footer class="site-footer">
        <!-- Footer content will be implemented in a later iteration. -->
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
