<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow - Personal Task Manager</title>
  <meta name="description" content="TaskFlow is a browser-based task manager. Tasks are saved in your browser.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#task-list-heading">Skip to task list</a>

  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1 class="brand">TaskFlow</h1>
        <p class="tagline">Plan it, track it, finish it.</p>
      </div>
      <button type="button" class="btn btn-primary" id="new-task-btn">Create Task</button>
    </div>
  </header>

  <main class="container">
    <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>

    <section aria-labelledby="stats-heading" class="stats-section">
      <h2 id="stats-heading" class="visually-hidden">Task summary</h2>
      <dl class="stats" id="stats"></dl>
    </section>

    <div class="workspace">
      <section aria-labelledby="form-heading" class="panel form-panel" id="form-panel">
        <div class="panel-head">
          <h2 id="form-heading">Create task</h2>
          <span class="mode-badge" id="mode-badge">New</span>
        </div>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="title">Title <span class="req">(required)</span></label>
            <input type="text" id="title" name="title" autocomplete="off" aria-describedby="title-hint title-error">
            <p class="hint" id="title-hint">Up to 100 characters. <span id="title-count">0/100</span></p>
            <p class="error" id="title-error"></p>
          </div>
          <div class="field">
            <label for="description">Description <span class="opt">(optional)</span></label>
            <textarea id="description" name="description" rows="3" aria-describedby="description-hint description-error"></textarea>
            <p class="hint" id="description-hint">Up to 500 characters. <span id="description-count">0/500</span></p>
            <p class="error" id="description-error"></p>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category" aria-describedby="category-error"><option value="">Select category</option><option value="Work">Work</option><option value="Personal">Personal</option><option value="Study">Study</option><option value="Development">Development</option></select>
              <p class="error" id="category-error"></p>
            </div>
            <div class="field">
              <label for="priority">Priority</label>
              <select id="priority" name="priority" aria-describedby="priority-error"><option value="">Select priority</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select>
              <p class="error" id="priority-error"></p>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status" aria-describedby="status-error"><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select>
              <p class="error" id="status-error"></p>
            </div>
            <div class="field">
              <label for="dueDate">Due date <span class="opt">(optional)</span></label>
              <input type="date" id="dueDate" name="dueDate" aria-describedby="dueDate-error">
              <p class="error" id="dueDate-error"></p>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Create Task</button>
            <button type="button" class="btn btn-secondary" id="clear-btn">Clear form</button>
            <button type="button" class="btn btn-secondary" id="cancel-btn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="task-list-heading" class="panel list-panel">
        <h2 id="task-list-heading" tabindex="-1">Your Tasks <span class="sub">(Task History)</span></h2>
        <form class="toolbar" id="toolbar" role="search" aria-label="Search, filter and sort tasks" novalidate>
          <div class="field toolbar-search">
            <label for="search">Search</label>
            <input type="search" id="search" placeholder="Search title or description" autocomplete="off">
          </div>
          <div class="field">
            <label for="filter-status">Status</label>
            <select id="filter-status"><option value="all">All</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option><option value="Overdue">Overdue</option></select>
          </div>
          <div class="field">
            <label for="filter-category">Category</label>
            <select id="filter-category"><option value="all">All</option><option value="Work">Work</option><option value="Personal">Personal</option><option value="Study">Study</option><option value="Development">Development</option></select>
          </div>
          <div class="field">
            <label for="filter-priority">Priority</label>
            <select id="filter-priority"><option value="all">All</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select>
          </div>
          <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="priority">Priority (high first)</option><option value="dueDate">Due date (soonest first)</option><option value="title">Title A-Z</option></select>
          </div>
        </form>
        <p class="result-count" id="result-count"></p>
        <div id="empty-state" class="empty-state" hidden></div>
        <ul class="task-list" id="task-list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Tasks are saved only in this browser (localStorage). They are not encrypted, so avoid storing sensitive information.</p>
      <div id="reset-area"></div>
    </div>
  </footer>

  <noscript><p class="container noscript">TaskFlow needs JavaScript enabled to manage tasks.</p></noscript>
  <script defer src="js/validation.js"></script>
  <script defer src="js/tasks.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
